name: _ProbeLocalTennisCourts

on:
  push:
    branches:
      - claude/great-wright-qmb6rv
    paths:
      - ".github/workflows/_probe-localtenniscourts.yml"
      - "scripts/_probe_localtenniscourts.py"
      - "scripts/_probe_localtenniscourts_pw.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/_probe_localtenniscourts.py
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/_probe_localtenniscourts_pw.py
