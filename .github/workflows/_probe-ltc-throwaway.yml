name: Probe LTC (throwaway)

on:
  push:
    branches:
      - claude/great-wright-pjt2xr

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'
      - run: pip install playwright requests
      - run: playwright install --with-deps chromium
      - run: python scripts/_probe_ltc_throwaway.py
