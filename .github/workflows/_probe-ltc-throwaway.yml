name: Probe LTC (throwaway)

on:
  push:
    branches:
      - claude/great-wright-cnoylg
    paths:
      - '.github/workflows/_probe-ltc-throwaway.yml'
      - 'scripts/_probe_ltc_throwaway.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Probe localtenniscourts.com
        run: python scripts/_probe_ltc_throwaway.py
