name: Probe localtenniscourts

on:
  push:
    branches:
      - claude/great-wright-ivyn2o

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch page and look for API calls
        run: |
          set -x
          echo "--- HTML fetch ---"
          curl -sS -D - -o page.html "https://localtenniscourts.com/?q=highbury-fields%2Cislington-tennis-centre-outdoor" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" || true
          echo "--- status ---"
          echo "--- size ---"
          wc -c page.html || true
          echo "--- grep for api/json/fetch/xhr hints ---"
          grep -oiE '(https?:)?//[a-z0-9.-]+/[a-z0-9/_.-]*(api|json|graphql)[a-z0-9/_.?=&-]*' page.html | sort -u | head -50 || true
          echo "--- script src tags ---"
          grep -oiE '<script[^>]*src="[^"]*"' page.html | sort -u | head -50 || true
          echo "--- first 200 lines of html ---"
          head -c 4000 page.html
