name: Probe LTC (throwaway)

on:
  push:
    branches:
      - claude/great-wright-ldtafr

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch main page
        run: |
          set -x
          URL='https://localtenniscourts.com/?q=highbury-fields%2Cislington-tennis-centre-outdoor'
          curl -sS -D /tmp/headers.txt -o /tmp/page.html "$URL" \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
          echo "--- HEADERS ---"
          cat /tmp/headers.txt
          echo "--- SIZE ---"
          wc -c /tmp/page.html
          echo "--- SCRIPT SRC TAGS ---"
          grep -oE '<script[^>]*src="[^"]*"' /tmp/page.html || true
          echo "--- INLINE fetch/axios/api hints ---"
          grep -oE '(fetch\(|axios\.|/api/[a-zA-Z0-9_./-]*|\.json[^a-zA-Z]|graphql)' /tmp/page.html | sort -u || true
          echo "--- ROBOTS ---"
          curl -sS https://localtenniscourts.com/robots.txt || true
          echo "--- FIRST 200 LINES OF HTML ---"
          head -c 20000 /tmp/page.html

      - name: Try common API guesses
        run: |
          set -x
          for path in "/api/availability" "/api/courts" "/api/slots" "/wp-json/" "/_next/data" ; do
            echo "=== $path ==="
            curl -sS -o /dev/null -w 'HTTP %{http_code}\n' "https://localtenniscourts.com${path}" || true
            sleep 1
          done

      - name: Look for green/available cells and date-nav controls
        run: |
          set -x
          echo "--- CELL COLOR CLASSES (unique bg- classes near table cells) ---"
          grep -oE 'bg-(green|emerald|red|amber|yellow|slate)-[0-9]+/?[0-9]*' /tmp/page.html | sort -u || true
          echo "--- Any <a href with booking-like link near table ---"
          grep -oE '<a[^>]*href="[^"]*"[^>]*>' /tmp/page.html | grep -iE 'book|slot|court' | head -30 || true
          echo "--- text around 'Wed' if present ---"
          grep -oE '.{80}Wed.{80}' /tmp/page.html || echo "no literal Wed found"
          echo "--- search for offset/day/week/date query param hints in HTML ---"
          grep -oE '(href|data-[a-z-]*)="[^"]*(offset|week|day|date)[^"]*"' /tmp/page.html | sort -u | head -40 || true
          echo "--- full page saved size ---"
          wc -c /tmp/page.html

      - name: Fetch a future-date query to see if URL param shifts the window
        run: |
          set -x
          for q in \
            'https://localtenniscourts.com/?q=highbury-fields%2Cislington-tennis-centre-outdoor&start=2026-07-15' \
            'https://localtenniscourts.com/?q=highbury-fields%2Cislington-tennis-centre-outdoor&date=2026-07-15' \
            'https://localtenniscourts.com/?q=highbury-fields%2Cislington-tennis-centre-outdoor&offset=7' \
            'https://localtenniscourts.com/?q=highbury-fields%2Cislington-tennis-centre-outdoor&days=14' \
            ; do
            echo "=== $q ==="
            curl -sS "$q" -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
              | grep -oE '(Wed|Thu|Fri|Sat|Sun|Mon|Tue) [0-9]+' | sort -u | tr '\n' ' '
            echo
            sleep 1.5
          done

      - name: Fetch JS bundles and grep for fetch/xhr endpoints
        run: |
          set -x
          curl -sS -o /tmp/main.js 'https://localtenniscourts.com/assets/main-DLXMVjOc.js'
          curl -sS -o /tmp/index.js 'https://localtenniscourts.com/assets/index-Bf7utVcV.js'
          wc -c /tmp/main.js /tmp/index.js
          echo "--- api-ish strings in main.js ---"
          grep -oE '"(/[a-zA-Z0-9_/-]*api[a-zA-Z0-9_/-]*)"' /tmp/main.js | sort -u | head -40 || true
          echo "--- api-ish strings in index.js ---"
          grep -oE '"(/[a-zA-Z0-9_/-]*api[a-zA-Z0-9_/-]*)"' /tmp/index.js | sort -u | head -40 || true
          echo "--- fetch( calls context in index.js (first 5) ---"
          grep -oE '.{60}fetch\(.{80}' /tmp/index.js | head -5 || true
          grep -oE '.{60}fetch\(.{80}' /tmp/main.js | head -5 || true
          echo "--- look for 'offset' or 'weekOffset' or query param builders ---"
          grep -oE '.{40}(weekOffset|dayOffset|startDate|numDays|daysAhead).{40}' /tmp/index.js | sort -u | head -20 || true
          grep -oE '.{40}(weekOffset|dayOffset|startDate|numDays|daysAhead).{40}' /tmp/main.js | sort -u | head -20 || true
