
name: Poller

on:
  workflow_dispatch:
  schedule:
    # Every 5 minutes, Wednesdays only, 11:00-22:55 UTC (covers noon-22:00
    # local time across both GMT and BST without needing DST-aware cron).
    - cron: '*/5 11-22 * * 3'

# prevent overlap
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true    # cancel older in-progress when a new run is queued

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Restore previous state from the newest cache that matches the prefix
      - name: Restore cached state
        id: cache-restore
        uses: actions/cache@v5
        with:
          path: cache
          key: state-${{ runner.os }}-${{ github.run_id }}         # unique per run (forces save)
          restore-keys: |
            state-${{ runner.os }}-

      - name: Setup Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run poller
        env:
          CACHE_STATE_PATH: cache/state.json
          LOG_LEVEL: INFO

          # Gmail SMTP
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          python -m tennis_app

      # Save a new cache (immutable) so the next run can restore the latest via prefix
      - name: Save cached state for next run
        uses: actions/cache/save@v5
        with:
          path: cache
          key: state-${{ runner.os }}-${{ github.run_id }}
