name: Probe Highbury Fields venue slug

on:
  push:
    branches:
      - claude/great-wright-7w2wyi

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Probe Better Admin venue slugs
        run: |
          python scripts/probe_venue.py \
            islington-tennis-centre:tennis-court-outdoor \
            islington-parks:highbury-fields-activities \
            --days 2 --delay 3
