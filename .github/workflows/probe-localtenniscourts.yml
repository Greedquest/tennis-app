name: Probe localtenniscourts.com

on:
  push:
    branches:
      - claude/great-wright-kdzwax

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run probe
        run: python scripts/probe_localtenniscourts.py
