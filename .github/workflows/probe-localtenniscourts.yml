name: Probe localtenniscourts.com

on:
  push:
    branches:
      - claude/great-wright-uc4yhh
    paths:
      - .github/workflows/probe-localtenniscourts.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Fetch page HTML three times (check if load error is transient)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          for i in 1 2 3; do
            echo "=== attempt $i ==="
            curl -sSL "https://localtenniscourts.com/?q=highbury-fields%2Cislington-tennis-centre-outdoor" \
              -A "$UA" -H "Accept: text/html,application/xhtml+xml" \
              -o "page$i.html" -w "HTTP %{http_code}\n"
            echo "tableData/error snippet:"
            grep -oE 'tableData:[a-zA-Z0-9_.]*,venues' "page$i.html" | head -1 || true
            grep -oE 'error:\$R\[[0-9]+\]=\{message:"[^"]*"\}' "page$i.html" || echo "no error found"
            sleep 3
          done

      - name: Show full HTML (first attempt)
        run: cat page1.html

      - name: Grep for API/data hints
        run: |
          echo "--- script src tags ---"
          grep -oE '<script[^>]*src="[^"]*"' page1.html || true
          echo "--- inline api/json/fetch/xhr mentions ---"
          grep -ioE '(https?://[a-z0-9.-]+)?/[a-z0-9_./-]*api[a-z0-9_./-]*' page1.html || true
          grep -ioE 'fetch\([^)]*\)' page1.html || true
          grep -ioE '__NEXT_DATA__|__NUXT__|window\.__[A-Za-z_]*' page1.html || true
          echo "--- any .json references ---"
          grep -ioE '[a-zA-Z0-9_./-]*\.json[a-zA-Z0-9?=&_./-]*' page1.html || true

      - name: Try robots.txt and common API roots
        run: |
          for path in robots.txt sitemap.xml api api/courts api/availability data.json _serverFn api/trpc; do
            echo "=== /$path ==="
            curl -sSL -o /dev/null -w "HTTP %{http_code}  %{url_effective}\n" "https://localtenniscourts.com/$path" \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
            sleep 1
          done

      - name: Fetch main JS bundle and grep for API/backend hints
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          curl -sSL "https://localtenniscourts.com/assets/main-DLXMVjOc.js" -A "$UA" -o main.js -w "HTTP %{http_code}  bytes=%{size_download}\n"
          curl -sSL "https://localtenniscourts.com/assets/index-Bf7utVcV.js" -A "$UA" -o index.js -w "HTTP %{http_code}  bytes=%{size_download}\n"
          echo "--- searching bundles for backend hints ---"
          grep -oE '(https?://[a-zA-Z0-9.-]+)' main.js index.js | sort -u || true
          grep -ioE '/_serverFn/[a-zA-Z0-9_/-]*' main.js index.js | sort -u || true
          grep -ioE 'supabase|convex|trpc|better-admin|bookings\.better|graphql' main.js index.js | sort -u || true
          echo "--- context around every _serverFn occurrence in main.js ---"
          grep -oE '.{150}_serverFn.{150}' main.js | head -20 || true
          echo "--- sample around 'tableData' fetch logic in index.js ---"
          grep -oE '.{80}fetchTableData.{80}|.{80}getTableData.{80}|.{80}fetch\(.{120}' index.js | head -20 || true

      - name: Try single-venue query (isolate whether multi-venue causes the error)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          for q in "highbury-fields" "islington-tennis-centre-outdoor"; do
            echo "=== q=$q ==="
            curl -sSL "https://localtenniscourts.com/?q=$q" -A "$UA" -o "single.html" -w "HTTP %{http_code}\n"
            grep -oE 'tableData:[a-zA-Z0-9_.\[\]]*' single.html | head -1 || true
            grep -oE 'error:\$R\[[0-9]+\]=\{message:"[^"]*"\}' single.html || echo "no error found"
            sleep 2
          done

      - name: Probe Better Admin API for Highbury Fields court slug
        run: |
          python3 scripts/probe_venue.py \
            islington-tennis-centre:tennis-court-outdoor \
            islington-parks:tennis-court-outdoor \
            islington-parks:highbury-fields \
            islington-parks:highbury-fields-tennis-courts \
            islington-parks:highbury-fields-activities \
            --days 3 --delay 1.5
