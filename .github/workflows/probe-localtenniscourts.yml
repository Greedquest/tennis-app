name: Probe localtenniscourts.com

on:
  push:
    branches:
      - claude/great-wright-kmwn1q
    paths:
      - '.github/workflows/probe-localtenniscourts.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch full page and dump verbatim
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -o page.html -A "$UA" "https://localtenniscourts.com/?q=highbury-fields%2Cislington-tennis-centre-outdoor"
          echo "total bytes: $(wc -c < page.html)"
          echo "=== FULL PAGE START ==="
          cat page.html
          echo "=== FULL PAGE END ==="
