name: Probe localtenniscourts.com

on:
  push:
    branches:
      - claude/great-wright-kmwn1q
    paths:
      - '.github/workflows/probe-localtenniscourts.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch main page (headers + body)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          echo "=== HEADERS ==="
          curl -sS -D - -o page.html -A "$UA" "https://localtenniscourts.com/?q=highbury-fields%2Cislington-tennis-centre-outdoor"
          echo "=== BODY (first 20000 chars) ==="
          head -c 20000 page.html
          echo
          echo "=== SCRIPT TAGS ==="
          grep -oE '<script[^>]*>' page.html || true
          echo "=== SCRIPT SRC URLS ==="
          grep -oE 'src="[^"]+\.js[^"]*"' page.html | sort -u || true
          echo "=== INLINE JSON-ish (window\.|__NEXT_DATA__|application/json) ==="
          grep -oE '(window\.[A-Za-z_]+\s*=|__NEXT_DATA__|application/(ld\+)?json)' page.html | sort -u || true

      - name: robots.txt and sitemap
        run: |
          echo "=== robots.txt ==="
          curl -sS "https://localtenniscourts.com/robots.txt" || true
          echo
          echo "=== sitemap.xml ==="
          curl -sS "https://localtenniscourts.com/sitemap.xml" | head -c 3000 || true

      - name: Guess common API/data endpoints
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for path in \
            "/api/availability?q=highbury-fields,islington-tennis-centre-outdoor" \
            "/api/courts" \
            "/api/slots" \
            "/_next/data" \
            "/data.json" \
            "/api/v1/courts" \
            "/api/v1/availability"; do
            echo "--- GET $path ---"
            curl -sS -o /dev/null -w "status=%{http_code} type=%{content_type} size=%{size_download}\n" -A "$UA" "https://localtenniscourts.com${path}" || true
          done
