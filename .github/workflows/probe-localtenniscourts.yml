name: Probe localtenniscourts.com (throwaway)

on:
  push:
    branches:
      - claude/great-wright-lqtg0m

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Probe site (static)
        run: python scripts/probe_localtenniscourts.py

      - name: Probe site (headless browser network capture)
        run: python scripts/probe_playwright.py
