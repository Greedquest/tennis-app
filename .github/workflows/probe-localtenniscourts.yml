name: Probe localtenniscourts.com (throwaway)

on:
  push:
    branches:
      - claude/great-wright-pctu1r

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Confirm Highbury Fields slug directly against Better Admin
        run: |
          python scripts/probe_venue.py \
            islington-tennis-centre:tennis-court-outdoor \
            islington-tennis-centre:highbury-tennis \
            --days 3 --delay 1.5
