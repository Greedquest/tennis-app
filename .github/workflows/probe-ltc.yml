name: Probe LTC (throwaway)

on:
  push:
    branches:
      - claude/great-wright-g4ve5c

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Probe localtenniscourts.com
        run: python scripts/probe_ltc.py
