name: Probe LTC (throwaway)

on:
  push:
    branches:
      - claude/great-wright-otyjrj

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Capture network requests
        run: |
          python3 - <<'EOF'
          import json
          from playwright.sync_api import sync_playwright

          requests_log = []

          def on_request(req):
              requests_log.append({"type": "request", "method": req.method, "url": req.url})

          def on_response(res):
              try:
                  ct = res.headers.get("content-type", "")
              except Exception:
                  ct = ""
              entry = {"type": "response", "status": res.status, "url": res.url, "content_type": ct}
              if "json" in ct or "api" in res.url.lower():
                  try:
                      entry["body_snippet"] = res.text()[:2000]
                  except Exception as e:
                      entry["body_err"] = str(e)
              requests_log.append(entry)

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.on("request", on_request)
              page.on("response", on_response)
              page.goto(
                  "https://localtenniscourts.com/?q=highbury-fields%2Cislington-tennis-centre-outdoor",
                  wait_until="networkidle",
                  timeout=30000,
              )
              page.wait_for_timeout(4000)
              browser.close()

          non_asset = [
              r for r in requests_log
              if not any(seg in r["url"] for seg in ["/assets/", "googletagmanager", "buymeacoffee", "favicon", "font", "cdn-cgi", ".css", ".png", ".ico", ".svg", ".webmanifest"])
          ]
          print(f"Total requests: {len(requests_log)}; non-asset: {len(non_asset)}")
          print(json.dumps(non_asset, indent=2)[:8000])
          EOF
