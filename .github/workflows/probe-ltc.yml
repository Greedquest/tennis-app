name: Probe LTC (throwaway)

on:
  push:
    branches:
      - claude/great-wright-otyjrj

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch full HTML and search for embedded data
        run: |
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://localtenniscourts.com/?q=highbury-fields%2Cislington-tennis-centre-outdoor" \
            -o page.html -w "HTTP status: %{http_code}\n"
          echo "--- total bytes: $(wc -c < page.html) ---"
          echo "--- keyword search across FULL html ---"
          grep -oiE '(highbury|islington|clissold|spaces|venue|court|tennis-court|booking|__DATA__|<script type="application/json")' page.html | sort | uniq -c | sort -rn | head -40
          echo "--- script tag boundaries ---"
          grep -oE '<script[^>]*>' page.html
          echo "--- last 4000 chars of body (often where hydration data sits) ---"
          tail -c 4000 page.html
          echo ""
          echo "--- chars 3000-9000 ---"
          dd if=page.html bs=1 skip=3000 count=6000 2>/dev/null

      - name: Extract spaces/booking object structure from streamed HTML
        run: |
          echo "--- context around 'spaces:' occurrences (first 15) ---"
          grep -oE '.{0,20}spaces:[^}]{0,200}' page.html | head -15
          echo "--- context around 'booking:' occurrences (first 10) ---"
          grep -oE '.{0,20}booking:[^,}]{0,80}' page.html | head -10
          echo "--- \$R[ object literal near first 'spaces' occurrence (2000 chars) ---"
          python3 - <<'PYEOF'
          with open("page.html", "r", encoding="utf-8", errors="replace") as f:
              html = f.read()
          idx = html.find("spaces:")
          print(html[max(0, idx-1500):idx+3000])
          PYEOF

