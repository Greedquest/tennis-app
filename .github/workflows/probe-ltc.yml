name: Probe LocalTennisCourts

on:
  push:
    branches:
      - claude/great-wright-aekb2h

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch JS bundles referenced by the SPA and grep for API hints
        run: |
          set -x
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          for asset in "/assets/main-DLXMVjOc.js" "/assets/index-Bf7utVcV.js"; do
            echo "=== $asset ==="
            curl -sS -A "$UA" "https://localtenniscourts.com${asset}" -o /tmp/bundle.js || true
            wc -c /tmp/bundle.js || true
            echo "--- fetch(/axios/api-looking substrings ---"
            grep -oE '(https?://[a-zA-Z0-9.\-]+)?/[a-zA-Z0-9._\-]*api[a-zA-Z0-9._/\-]*' /tmp/bundle.js | sort -u | head -50 || true
            echo "--- supabase/vercel/base-url-looking substrings ---"
            grep -oE '(https?://[a-zA-Z0-9.\-]*\.(supabase\.co|vercel\.app|onrender\.com|railway\.app|fly\.dev|herokuapp\.com|workers\.dev|convex\.cloud))[a-zA-Z0-9._/\-]*' /tmp/bundle.js | sort -u | head -50 || true
            echo "--- generic https:// hostnames referenced ---"
            grep -oE 'https?://[a-zA-Z0-9.\-]+' /tmp/bundle.js | sort -u | head -80 || true
            echo "--- fetch( and axios( call sites (100 chars context) ---"
            grep -oE '.{0,60}(fetch\(|axios\.(get|post)\().{0,80}' /tmp/bundle.js | head -30 || true
          done
