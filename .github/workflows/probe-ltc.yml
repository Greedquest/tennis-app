name: Probe localtenniscourts.com

on:
  push:
    branches:
      - claude/great-wright-nvwwp0
    paths:
      - '.github/workflows/probe-ltc.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Load page, log ALL requests, dump rendered text + screenshot
        run: |
          python3 - <<'PYEOF'
          import json
          from playwright.sync_api import sync_playwright

          URL = "https://localtenniscourts.com/?q=highbury-fields%2Cislington-tennis-centre-outdoor"
          requests_seen = []

          def on_request(req):
              requests_seen.append({"method": req.method, "url": req.url, "type": req.resource_type})

          console_msgs = []

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.on("request", on_request)
              page.on("console", lambda msg: console_msgs.append(f"[{msg.type}] {msg.text}"))
              page.on("pageerror", lambda exc: console_msgs.append(f"[pageerror] {exc}"))
              page.goto(URL, wait_until="load", timeout=30000)
              page.wait_for_timeout(6000)
              page.screenshot(path="/tmp/screenshot.png", full_page=True)
              body_text = page.inner_text("body")
              html = page.content()
              browser.close()

          print(f"=== {len(requests_seen)} total requests ===")
          for r in requests_seen:
              print(r["type"], r["method"], r["url"])

          print("=== console/page errors ===")
          for m in console_msgs:
              print(m)

          print("=== rendered body innerText (first 3000 chars) ===")
          print(body_text[:3000])

          with open("/tmp/rendered.html", "w") as f:
              f.write(html)
          with open("/tmp/body_text.txt", "w") as f:
              f.write(body_text)
          PYEOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltc-render-dump
          path: |
            /tmp/screenshot.png
            /tmp/rendered.html
            /tmp/body_text.txt
          retention-days: 1
