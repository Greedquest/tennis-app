name: Probe LTC (throwaway)

on:
  push:
    branches:
      - claude/great-wright-jdswhy
    paths:
      - '.github/workflows/probe-ltc.yml'
      - 'scripts/probe_ltc.py'
      - 'scripts/probe_venue.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests
      - name: Probe Better Admin for Highbury Fields slug
        run: python scripts/probe_venue.py islington-tennis-centre:tennis-court-outdoor islington-parks:tennis-court-outdoor --days 10 --delay 1.5
