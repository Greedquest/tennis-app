name: Probe localtenniscourts.com

on:
  push:
    branches:
      - claude/great-wright-nvwwp0
    paths:
      - '.github/workflows/probe-ltc.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Load page in a real browser and capture network traffic
        run: |
          python3 - <<'PYEOF'
          import json
          from playwright.sync_api import sync_playwright

          URL = "https://localtenniscourts.com/?q=highbury-fields%2Cislington-tennis-centre-outdoor"
          calls = []

          def on_response(response):
              req = response.request
              ct = response.headers.get("content-type", "")
              if req.resource_type in ("xhr", "fetch") or "json" in ct:
                  entry = {
                      "url": response.url,
                      "method": req.method,
                      "status": response.status,
                      "content_type": ct,
                      "post_data": req.post_data,
                  }
                  try:
                      entry["body"] = response.text()[:4000]
                  except Exception as e:
                      entry["body"] = f"<error reading body: {e}>"
                  calls.append(entry)

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.on("response", on_response)
              page.goto(URL, wait_until="networkidle", timeout=30000)
              # give any lazy client-side fetches a moment
              page.wait_for_timeout(4000)
              browser.close()

          print(f"=== Captured {len(calls)} xhr/fetch/json responses ===")
          for c in calls:
              print("-" * 80)
              print(json.dumps({k: v for k, v in c.items() if k != "body"}, indent=2))
              print("BODY:", c["body"])

          with open("/tmp/network_calls.json", "w") as f:
              json.dump(calls, f, indent=2)
          PYEOF

      - name: Upload captured network calls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltc-network-calls
          path: /tmp/network_calls.json
          retention-days: 1
