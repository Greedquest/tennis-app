name: Probe localtenniscourts.com

on:
  push:
    branches:
      - claude/great-wright-nvwwp0
    paths:
      - '.github/workflows/probe-ltc.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch JS bundles and grep for API/data hints
        run: |
          set -x
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          for asset in "/assets/index-Bf7utVcV.js" "/assets/main-DLXMVjOc.js"; do
            echo "=== $asset ==="
            curl -sS -A "$UA" "https://localtenniscourts.com$asset" -o /tmp/bundle.js -w "HTTP_CODE:%{http_code} SIZE:%{size_download}\n"
            echo "--- fetch/axios/api calls ---"
            grep -oE '(fetch|axios\.[a-z]+)\(["'"'"'`][^"'"'"'`]{0,200}' /tmp/bundle.js | sort -u | head -40
            echo "--- string literals containing api/supabase/graphql/http ---"
            grep -oE '"[^"]{0,10}(api|supabase|graphql|firestore|convex|functions)[^"]{0,120}"' /tmp/bundle.js | sort -u | head -40
            echo "--- any https:// literals ---"
            grep -oE 'https?://[a-zA-Z0-9._/%?=&-]{5,120}' /tmp/bundle.js | sort -u | head -60
            echo "--- createServerFn / _serverFn hints ---"
            grep -oE '[a-zA-Z0-9_/-]*[sS]erver[fF]n[a-zA-Z0-9_/-]*' /tmp/bundle.js | sort -u | head -20
            echo "--- size on disk ---"
            wc -c /tmp/bundle.js
          done

          echo "=== direct known-endpoint guesses with TSR-ish headers ==="
          for path in "/highbury-fields" "/islington-tennis-centre-outdoor" "/api/venues/highbury-fields" "/_serverFn/getCourts" ; do
            echo "-- $path --"
            curl -sS -A "$UA" -H "Accept: text/x-component" "https://localtenniscourts.com$path" -w "\nHTTP_CODE:%{http_code}\n" | head -c 500
            echo
          done
