name: Throwaway Probe

on:
  push:
    branches:
      - claude/great-wright-l9nfdd

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch localtenniscourts.com page
        run: |
          echo "--- HTTP headers ---"
          curl -sS -D - -o /tmp/ltc.html \
            "https://localtenniscourts.com/?q=highbury-fields%2Cislington-tennis-centre-outdoor" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            || echo "curl failed with status $?"
          echo "--- byte size ---"
          wc -c /tmp/ltc.html || true
          echo "--- script/src tags ---"
          grep -Eo '<script[^>]*src="[^"]*"' /tmp/ltc.html | sort -u || true
          echo "--- api/json/fetch/xhr mentions ---"
          grep -Eio '(https?:)?//[a-z0-9.-]*api[a-z0-9.-]*[a-z0-9/_?=&.-]*' /tmp/ltc.html | sort -u | head -50 || true
          grep -Eio '"[a-zA-Z0-9_-]*\.(json|php)"' /tmp/ltc.html | sort -u | head -50 || true
          echo "--- __NEXT_DATA__ / window.__INITIAL_STATE__ presence ---"
          grep -Eo '__NEXT_DATA__|__INITIAL_STATE__|__NUXT__' /tmp/ltc.html | sort -u || true
          echo "--- first 3000 chars of body ---"
          head -c 3000 /tmp/ltc.html || true

      - name: Probe Better Admin API for untried Highbury slug candidates
        run: |
          python3 - <<'EOF'
          import json
          import time
          import urllib.request
          import urllib.error
          from datetime import datetime, timedelta

          HEADERS = {
              "Origin": "https://bookings.better.org.uk",
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/120.0.0.0 Safari/537.36"
              ),
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://bookings.better.org.uk/",
          }

          candidates = [
              ("islington-tennis-centre", "tennis-court-outdoor"),  # known-good control
              ("islington-parks", "highbury-fields-activities"),
              ("highbury-fields", "tennis-court-outdoor"),
              ("islington-parks", "highbury-fields"),
          ]

          today = datetime.now().date()
          dates = [(today + timedelta(days=i)).strftime("%Y-%m-%d") for i in range(3)]

          for venue, court in candidates:
              url = f"https://better-admin.org.uk/api/activities/venue/{venue}/activity/{court}/times"
              for date in dates:
                  req = urllib.request.Request(f"{url}?date={date}", headers=HEADERS)
                  try:
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          body = resp.read()
                          try:
                              data = json.loads(body).get("data", [])
                              n = len(data)
                          except Exception:
                              n = "unparseable"
                          print(f"{resp.status:4} n={n!s:>6}  {date}  {venue}:{court}")
                  except urllib.error.HTTPError as e:
                      print(f"{e.code:4} n=  err  {date}  {venue}:{court}  {e.reason}")
                  except Exception as e:
                      print(f" ERR              {date}  {venue}:{court}  {e}")
                  time.sleep(1.5)
          EOF
