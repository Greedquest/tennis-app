name: Probe venue slugs

# One-off manual helper to confirm the real Better Admin venue/activity slugs
# (in particular Highbury Fields) from a runner that can reach the booking API.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Probe candidate slugs
        env:
          LOG_LEVEL: INFO
        run: python -m tennis_app.probe
