name: Verify watch_highbury_fields.py (throwaway)

on:
  push:
    branches:
      - claude/great-wright-p4wy5b

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run watch script (forced, no-notify)
        run: python scripts/watch_highbury_fields.py --force --no-notify --cache-path /tmp/watch-state.json

      - name: Run again to exercise the diff path
        run: python scripts/watch_highbury_fields.py --force --no-notify --cache-path /tmp/watch-state.json
